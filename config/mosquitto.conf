# Mosquitto configuration for AI Camera system

# Basic Configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Network Configuration
port 1883
bind_address 0.0.0.0

# WebSocket Support (optional)
listener 9001
protocol websockets

# Security
allow_anonymous true
# For production, set to false and configure authentication:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# Client Settings
max_connections 1000
max_keepalive 60
keepalive_interval 60
max_packet_size 1000000

# Message Settings
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 1000000

# AI Camera specific topics and QoS settings
# All AI Camera topics use QoS 1 for at-least-once delivery

# Topic patterns:
# aicamera/device/{deviceId}/register
# aicamera/device/{deviceId}/heartbeat  
# aicamera/device/{deviceId}/status
# aicamera/device/{deviceId}/log
# aicamera/device/{deviceId}/config
# aicamera/detection/{deviceId}/new
# aicamera/detection/{deviceId}/bulk
# aicamera/file/{deviceId}/upload_request
# aicamera/file/{deviceId}/upload_status
# aicamera/system/broadcast
# aicamera/system/alert

# Performance tuning
sys_interval 10
store_clean_interval 60
autosave_interval 1800
autosave_on_changes false

# Memory management
memory_limit 64MB
upgrade_outgoing_qos false
queue_qos0_messages false

# Connection limits per client
max_connections_per_hour 100